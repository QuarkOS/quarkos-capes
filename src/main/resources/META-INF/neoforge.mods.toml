modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

# source: ${source}
issueTrackerURL = "${issues}"

[[mods]]
modId = "quarkos_capes"
version = "${version}"
displayName = "Quark's Capes"
authors = "Emilio Schwaiger (QuarkOS)"
displayURL = "${homepage}"
logoFile = "assets/quarkos_capes/icon.png"
description = '''Choose, browse and share capes with animation, cloth physics and custom models. Animated capes are free.${cloth_note}'''

[[mixins]]
config = "quarkos_capes.mixins.json"

[[dependencies.quarkos_capes]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_dep},)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.quarkos_capes]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft}]"
ordering = "NONE"
side = "CLIENT"
${cloth_dependency}
