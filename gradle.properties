# Publication URLs. Each line is the whole change when a real value replaces the placeholder.
# -PserviceUrl overrides quarkos.serviceUrl for one build. A published jar must not pass -PallowLocalService=true.
# Production service URL (deployed 2026-11-19). Override per build with -PserviceUrl, or per user in Advanced.
quarkos.serviceUrl=https://api.emilioschwaiger.com
quarkos.homepage=https://github.com/QuarkOS/quarkos-capes
quarkos.source=https://github.com/QuarkOS/quarkos-capes
quarkos.issues=https://github.com/QuarkOS/quarkos-capes/issues

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk-amd64,/opt/jdk25
