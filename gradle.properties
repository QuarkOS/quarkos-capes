# Publication URLs. Each line is the whole change when a real value replaces the placeholder.
# -PserviceUrl overrides quarkos.serviceUrl for one build. A published jar must not pass -PallowLocalService=true.
# Planned production service URL after review and deployment is https://api.emilioschwaiger.com.
quarkos.serviceUrl=http://127.0.0.1:8787
quarkos.homepage=https://example.org/quarkos-capes
quarkos.source=https://example.org/quarkos-capes/source
quarkos.issues=https://example.org/quarkos-capes/source/issues

org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
org.gradle.java.installations.paths=/usr/lib/jvm/java-21-openjdk-amd64,/opt/jdk25
