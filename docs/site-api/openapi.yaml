"components":
  "securitySchemes":
    "minecraftBearer":
      "type": "http"
      "scheme": "bearer"
      "description": "12-hour Mojang hasJoined session"
    "adminBearer":
      "type": "http"
      "scheme": "bearer"
      "description": "CAPES_ADMIN_TOKEN, moderation only"
    "webSession":
      "type": "apiKey"
      "in": "cookie"
      "name": "capes_session"
    "csrf":
      "type": "apiKey"
      "in": "header"
      "name": "X-CSRF-Token"
      "description": "Required for cookie-authenticated writes, omitted on reads"
  "schemas":
    "Error":
      "type": "object"
      "properties":
        "api":
          "type": "integer"
          "const": 1
        "error":
          "type": "string"
        "message":
          "type": "string"
      "required":
        - "api"
        - "error"
        - "message"
    "Item":
      "type": "object"
      "properties":
        "id":
          "type": "string"
        "source":
          "enum":
            - "ours"
            - "labymod"
        "kind":
          "enum":
            - "cape"
            - "cloak"
        "title":
          "type": "string"
        "author":
          "type": "string"
        "tags":
          "type": "array"
          "items":
            "type": "string"
        "uses":
          "type": "integer"
          "minimum": 0
        "style":
          "enum":
            - "flat"
            - "frames"
            - "wave"
            - "model"
        "frameCount":
          "type": "integer"
          "minimum": 1
          "maximum": 32
        "frameWidth":
          "type": "integer"
        "frameHeight":
          "type": "integer"
        "frameDelayMs":
          "type": "array"
          "items":
            "type": "integer"
            "minimum": 50
            "maximum": 1000
        "animateFrames":
          "type": "boolean"
        "model":
          "anyOf":
            -
              "$ref": "#/components/schemas/Model"
            -
              "type": "null"
        "textureUrl":
          "type": "string"
          "format": "uri"
        "previewUrl":
          "type": "string"
          "format": "uri"
        "creditUrl":
          "type": "string"
          "format": "uri"
        "sha256":
          "type": "string"
          "pattern": "^[a-f0-9]{64}$"
        "owner":
          "type": "string"
          "format": "uuid"
        "status":
          "enum":
            - "accepted"
            - "pending"
            - "rejected"
            - "unpublished"
        "revision":
          "type": "integer"
        "updatedAt":
          "type": "string"
          "format": "date-time"
      "required":
        - "id"
        - "source"
        - "kind"
        - "title"
        - "tags"
        - "uses"
        - "style"
        - "frameCount"
        - "frameWidth"
        - "frameHeight"
        - "textureUrl"
    "ItemDetail":
      "allOf":
        -
          "$ref": "#/components/schemas/Item"
        -
          "type": "object"
          "properties":
            "api":
              "type": "integer"
              "const": 1
          "required":
            - "api"
    "Catalog":
      "type": "object"
      "properties":
        "api":
          "type": "integer"
          "const": 1
        "items":
          "type": "array"
          "items":
            "$ref": "#/components/schemas/Item"
        "nextCursor":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
        "sources":
          "type": "object"
          "additionalProperties":
            "enum":
              - "available"
              - "unavailable"
              - "disabled"
      "required":
        - "api"
        - "items"
        - "nextCursor"
        - "sources"
    "Wearing":
      "type": "object"
      "properties":
        "api":
          "type": "integer"
          "const": 1
        "uuid":
          "type": "string"
          "format": "uuid"
        "wearing":
          "anyOf":
            -
              "$ref": "#/components/schemas/Item"
            -
              "type": "null"
      "required":
        - "api"
        - "uuid"
        - "wearing"
    "WearReference":
      "type": "object"
      "properties":
        "source":
          "enum":
            - "ours"
            - "labymod"
        "id":
          "type": "string"
      "required":
        - "source"
        - "id"
      "additionalProperties": false
    "Claim":
      "type": "object"
      "properties":
        "api":
          "type": "integer"
          "const": 1
        "linked":
          "type": "boolean"
          "const": true
        "uuid":
          "type": "string"
          "format": "uuid"
        "name":
          "type": "string"
      "required":
        - "api"
        - "linked"
        - "uuid"
        - "name"
    "Model":
      "type": "object"
      "properties":
        "cubes":
          "type": "array"
          "maxItems": 64
          "items":
            "type": "object"
            "properties":
              "x":
                "type": "integer"
                "minimum": -32
                "maximum": 32
              "y":
                "type": "integer"
                "minimum": -32
                "maximum": 32
              "z":
                "type": "integer"
                "minimum": -32
                "maximum": 32
              "w":
                "type": "integer"
                "minimum": 1
                "maximum": 32
              "h":
                "type": "integer"
                "minimum": 1
                "maximum": 32
              "d":
                "type": "integer"
                "minimum": 1
                "maximum": 32
              "u":
                "type": "integer"
                "minimum": 0
                "maximum": 512
              "v":
                "type": "integer"
                "minimum": 0
                "maximum": 512
            "required":
              - "x"
              - "y"
              - "z"
              - "w"
              - "h"
              - "d"
              - "u"
              - "v"
      "required":
        - "cubes"
    "User":
      "type": "object"
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "username":
          "type": "string"
        "minecraftUuid":
          "anyOf":
            -
              "type": "string"
              "format": "uuid"
            -
              "type": "null"
        "minecraftName":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
        "admin":
          "type": "boolean"
        "banned":
          "type": "boolean"
      "required":
        - "id"
        - "username"
        - "minecraftUuid"
        - "minecraftName"
        - "admin"
        - "banned"
    "Account":
      "type": "object"
      "properties":
        "api":
          "type": "integer"
          "const": 1
        "user":
          "anyOf":
            -
              "$ref": "#/components/schemas/User"
            -
              "type": "null"
        "csrf":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
      "required":
        - "api"
        - "user"
        - "csrf"
    "GalleryRecord":
      "type": "object"
      "properties":
        "api":
          "type": "integer"
          "const": 1
        "id":
          "type": "string"
        "owner":
          "type": "string"
          "format": "uuid"
        "title":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
        "revision":
          "type": "integer"
        "updatedAt":
          "type": "string"
          "format": "date-time"
        "status":
          "type": "string"
        "style":
          "type": "string"
        "animateFrames":
          "type": "boolean"
        "frameCount":
          "type": "integer"
        "frameWidth":
