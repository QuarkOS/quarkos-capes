"openapi": "3.1.0"
"info":
  "title": "QuarkOS Capes API"
  "version": "1.0.0"
  "description": "Self-hosted catalog and cape reference service. See API.md for authentication, source ordering, rate limits, and compatibility details. No upstream image relay."
"servers":
  -
    "url": "http://127.0.0.1:8787"
    "description": "Local default; set CAPES_PUBLIC_URL in hosting"
"paths":
  "/v1/health":
    "get":
      "summary": "Service health"
      "operationId": "getV1Health"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "ok":
                    "type": "boolean"
                "required":
                  - "api"
                  - "ok"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
  "/v1/catalog":
    "get":
      "summary": "Browse the unified catalog"
      "operationId": "getV1Catalog"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Catalog"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "source"
          "in": "query"
          "required": false
          "schema":
            "enum":
              - ""
              - "ours"
              - "labymod"
        -
          "name": "kind"
          "in": "query"
          "required": false
          "schema":
            "enum":
              - ""
              - "cape"
              - "cloak"
        -
          "name": "q"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "maxLength": 48
        -
          "name": "sort"
          "in": "query"
          "required": false
          "schema":
            "enum":
              - "popular"
              - "newest"
              - "name"
            "default": "popular"
        -
          "name": "style"
          "in": "query"
          "required": false
          "schema":
            "enum":
              - ""
              - "flat"
              - "frames"
              - "wave"
              - "model"
        -
          "name": "tag"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "maxLength": 48
        -
          "name": "cursor"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
        -
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 50
            "default": 20
      "description": "LabyMod metadata is fetched live with a bounded TTL cache; textures are never relayed. Name sort is alphabetical per fixed 50-item upstream discovery window. Newest preserves upstream order where timestamps are unavailable. Empty pages may carry a nextCursor. See API.md for merge semantics."
  "/v1/catalog/{source}/{id}":
    "get":
      "summary": "Get a uniform item"
      "operationId": "getV1CatalogSourceId"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/ItemDetail"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "source"
          "in": "path"
          "required": true
          "schema":
            "enum":
              - "ours"
              - "labymod"
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
  "/v1/catalog/{source}/{id}/report":
    "post":
      "summary": "Report an item"
      "operationId": "postV1CatalogSourceIdReport"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "stored":
                    "type": "boolean"
                  "id":
                    "type": "string"
                    "format": "uuid"
                "required":
                  - "api"
                  - "stored"
                  - "id"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "source"
          "in": "path"
          "required": true
          "schema":
            "enum":
              - "ours"
              - "labymod"
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
      "security":
        - {}
        -
          "webSession": []
          "csrf": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "reason":
                  "type": "string"
                  "minLength": 1
                  "maxLength": 280
              "required":
                - "reason"
  "/v1/me/wearing":
    "put":
      "summary": "Equip an item by reference"
      "operationId": "putV1MeWearing"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Wearing"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Web users must link Minecraft first (409 minecraft_not_linked). Repeated identical equips do not increment wear counts."
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
          "csrf": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/WearReference"
    "get":
      "summary": "Get your active reference"
      "operationId": "getV1MeWearing"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Wearing"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
    "delete":
      "summary": "Remove your active reference"
      "operationId": "deleteV1MeWearing"
      "responses":
        "204":
          "description": "No content"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
          "csrf": []
  "/v1/players/{uuid}/wearing":
    "get":
      "summary": "Resolve a player’s active cape"
      "operationId": "getV1PlayersUuidWearing"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Wearing"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "304":
          "description": "ETag matches"
      "parameters":
        -
          "name": "uuid"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
        -
          "name": "If-None-Match"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
  "/v1/players/wearing":
    "get":
      "summary": "Resolve up to 50 players in request order"
      "operationId": "getV1PlayersWearing"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "players":
                    "type": "array"
                    "maxItems": 50
                    "items":
                      "$ref": "#/components/schemas/Wearing"
                "required":
                  - "api"
                  - "players"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
        "304":
          "description": "ETag matches"
      "parameters":
        -
          "name": "uuids"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "description": "Comma-separated UUIDs, up to 50; empty is allowed."
        -
          "name": "If-None-Match"
          "in": "header"
          "required": false
          "schema":
            "type": "string"
  "/v1/link/code":
    "post":
      "summary": "Create an eight-character one-time link code"
      "operationId": "postV1LinkCode"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "code":
                    "type": "string"
                    "pattern": "^[A-F0-9]{8}$"
                  "expiresAt":
                    "type": "string"
                    "format": "date-time"
                "required":
                  - "api"
                  - "code"
                  - "expiresAt"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "webSession": []
          "csrf": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties": {}
              "required": []
  "/v1/link/claim":
    "post":
      "summary": "Claim a web code using a Mojang-authenticated bearer"
      "operationId": "postV1LinkClaim"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Claim"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "minecraftBearer": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "code":
                  "type": "string"
                  "pattern": "^[A-Fa-f0-9]{8}$"
              "required":
                - "code"
  "/v1/account/register":
    "post":
      "summary": "Register a local account"
      "operationId": "postV1AccountRegister"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Account"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Sets a seven-day HttpOnly SameSite=Lax cookie, Secure when public origin uses HTTPS. Any supplied Origin must match CAPES_PUBLIC_URL."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "username":
                  "type": "string"
                  "pattern": "^[A-Za-z0-9_]{3,24}$"
                "password":
                  "type": "string"
                  "minLength": 10
                  "maxLength": 128
                  "writeOnly": true
              "required":
                - "username"
                - "password"
  "/v1/account/login":
    "post":
      "summary": "Login a local account"
      "operationId": "postV1AccountLogin"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Account"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Sets a seven-day HttpOnly SameSite=Lax cookie, Secure when public origin uses HTTPS. Any supplied Origin must match CAPES_PUBLIC_URL."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "username":
                  "type": "string"
                  "pattern": "^[A-Za-z0-9_]{3,24}$"
                "password":
                  "type": "string"
                  "minLength": 10
                  "maxLength": 128
                  "writeOnly": true
              "required":
                - "username"
                - "password"
  "/v1/account":
    "get":
      "summary": "Read web identity and CSRF token"
      "operationId": "getV1Account"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Account"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        - {}
        -
          "webSession": []
    "delete":
      "summary": "Sign out this web session"
      "operationId": "deleteV1Account"
      "responses":
        "204":
          "description": "No content"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "webSession": []
          "csrf": []
  "/v1/auth/challenge":
    "post":
      "summary": "Issue a two-minute Minecraft challenge"
      "operationId": "postV1AuthChallenge"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "serverId":
                    "type": "string"
                  "expiresAt":
                    "type": "string"
                    "format": "date-time"
                "required":
                  - "api"
                  - "serverId"
                  - "expiresAt"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties": {}
              "required": []
  "/v1/auth/complete":
    "post":
      "summary": "Verify Mojang hasJoined and issue a 12-hour bearer"
      "operationId": "postV1AuthComplete"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "token":
                    "type": "string"
                  "uuid":
                    "type": "string"
                    "format": "uuid"
                  "name":
                    "type": "string"
                  "expiresAt":
                    "type": "string"
                    "format": "date-time"
                "required":
                  - "api"
                  - "token"
                  - "uuid"
                  - "name"
                  - "expiresAt"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "description": "Never send an accessToken to this endpoint. Dev1 signed bearers remain supported only in explicit loopback dev mode."
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "username":
                  "type": "string"
                "serverId":
                  "type": "string"
              "required":
                - "username"
                - "serverId"
  "/v1/auth/session":
    "delete":
      "summary": "Revoke a Minecraft session"
      "operationId": "deleteV1AuthSession"
      "responses":
        "204":
          "description": "No content"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "minecraftBearer": []
  "/v1/uploads/{id}":
    "put":
      "summary": "Publish a cleaned cape"
      "operationId": "putV1UploadsId"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Item"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
          "csrf": []
      "requestBody":
        "required": true
        "content":
          "multipart/form-data":
            "schema":
              "type": "object"
              "properties":
                "file":
                  "type": "string"
                  "format": "binary"
                  "description": "PNG/GIF <=1 MiB. Frames: 64x32 or 22x17 integer multiples, <=512x256, <=32 frames, <=4,194,304 pixels."
                "title":
                  "type": "string"
                  "minLength": 1
                  "maxLength": 48
                "tags":
                  "type": "string"
                  "description": "JSON array, <=5 tags, each <=24 characters"
                "style":
                  "enum":
                    - "flat"
                    - "frames"
                    - "wave"
                    - "model"
                "animateFrames":
                  "enum":
                    - "true"
                    - "false"
                "frameCount":
                  "type": "integer"
                  "minimum": 1
                  "maximum": 32
                "frameWidth":
                  "type": "integer"
                "frameHeight":
                  "type": "integer"
                "frameDelayMs":
                  "type": "string"
                  "description": "JSON array of 50–1000 ms integers"
                "model":
                  "type": "string"
                  "description": "JSON encoded Model, required with model style, <=16 KiB"
              "required":
                - "file"
                - "title"
                - "style"
                - "animateFrames"
    "patch":
      "summary": "Edit metadata and re-enter moderation"
      "operationId": "patchV1UploadsId"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Item"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
          "csrf": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "title":
                  "type": "string"
                  "minLength": 1
                  "maxLength": 48
                "tags":
                  "type": "array"
                  "maxItems": 5
                  "items":
                    "type": "string"
                    "maxLength": 24
              "required":
                - "title"
                - "tags"
    "post":
      "summary": "Unpublish while keeping files"
      "operationId": "postV1UploadsId"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "ok":
                    "type": "boolean"
                "required":
                  - "api"
                  - "ok"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
          "csrf": []
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "type": "object"
              "properties":
                "action":
                  "const": "unpublish"
              "required":
                - "action"
    "delete":
      "summary": "Delete an owned upload"
      "operationId": "deleteV1UploadsId"
      "responses":
        "204":
          "description": "No content"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "parameters":
        -
          "name": "id"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "pattern": "^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$"
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
          "csrf": []
  "/v1/me/capes":
    "get":
      "summary": "List all your uploads including held or unpublished items"
      "operationId": "getV1MeCapes"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
                    "const": 1
                  "items":
                    "type": "array"
                    "items":
                      "$ref": "#/components/schemas/Item"
                "required":
                  - "api"
                  - "items"
        "default":
          "description": "Error (400, 401, 403, 404, 405, 409, 413, 415, 422, 429, 503)"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Error"
      "security":
        -
          "minecraftBearer": []
        -
          "webSession": []
  "/v1/admin":
    "get":
      "summary": "Read reports and non-public upload queue"
      "operationId": "getV1Admin"
      "responses":
        "200":
          "description": "Success"
          "content":
            "application/json":
              "schema":
                "type": "object"
                "properties":
                  "api":
                    "type": "integer"
